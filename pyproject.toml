    "asyncpg>=0.31.0",
    "cloudinary>=1.44.1",
    "fastapi>=0.128.0",
    "isort>=7.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.11.0.86",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "pyzbar>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.40.0",
    "zxing-cpp>=2.3.0",
]
