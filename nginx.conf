server {
    listen 80;
    listen [::]:80;  # Hỗ trợ IPv6 nếu cần

    server_name localhost;  # Hoặc domain thật khi deploy

    # Ẩn version Nginx (tăng security)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA routing: fallback mọi request không khớp file về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls đến backend FastAPI (dùng tên service 'app' trong Docker network)
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Proxy Swagger docs nếu dùng /docs hoặc /redoc
    location /docs/ {
        proxy_pass http://app:8000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc/ {
        proxy_pass http://app:8000/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nén gzip cho text/JS/CSS (giảm size tải 50-70%)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/xml application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets lâu (js, css, images, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Optional: Custom error page fallback
    error_page 404 /index.html;
}