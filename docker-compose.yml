services:
  db:  # PostgreSQL Database Service
    image: postgres:16
    restart: always
    container_name: my_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12Ab34fg56hi@
      POSTGRES_DB: barcode_db          
    ports:
      - "5432:5432"  # Defalut for PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data  # Save data for persistence

  pgadmin:  # Webtool for retrieve/update DB
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com     # Email logins pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin_password   # Password logins pgAdmin
    ports:
      - "5050:80"  # Access at http://localhost:5050
    depends_on:
      - db

volumes:
  pgdata:  # Volume save DB data