services:
  db:
    image: postgres:16-alpine  # Sử dụng alpine để nhẹ hơn, nhanh hơn
    restart: always
    container_name: barcode_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '12Ab34fg56hi@'  # Giữ nguyên nhưng KHÔNG nên commit mật khẩu này lên git
      POSTGRES_DB: barcode_db
    ports:
      - "5432:5432"  # Chỉ expose nếu bạn cần truy cập từ host (local dev)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:  # Thêm healthcheck để app chờ DB sẵn sàng
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    container_name: barcode_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'admin@strongpass123!'
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy  # Chờ DB healthy trước khi start pgAdmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  app:
    build:
      context: .
      dockerfile: Dockerfile  # Đảm bảo dùng Dockerfile đã chỉnh sửa (với libzbar0 + uv)
    container_name: barcode_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Kết nối nội bộ Docker network (tên service là 'db')
      - DATABASE_URL=postgresql+asyncpg://postgres:12Ab34fg56hi%40@db:5432/barcode_db
      # Nếu cần thêm biến môi trường khác (ví dụ Cloudinary)
      # - CLOUDINARY_CLOUD_NAME=your_cloud_name
      # - CLOUDINARY_API_KEY=your_key
      # - CLOUDINARY_API_SECRET=your_secret
    depends_on:
      db:
        condition: service_healthy  # App chỉ start khi DB sẵn sàng
    volumes:
      # Nếu cần persist log hoặc file tạm (thường không cần cho FastAPI)
      - ./logs:/app/logs  # Optional

volumes:
  pgdata:
  pgadmin_data:
  # app_data:  # Không cần nếu không có dữ liệu cần persist ngoài DB