name: Basic Python CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Must be FIRST – ensures repo files are present

      - name: Install uv (official action)
        uses: astral-sh/setup-uv@v3  # Use v3 or latest stable; v4/v5 if you want newer
        with:
          enable-cache: true                  # Safe to keep
          cache-dependency-glob: "**/uv.lock **/pyproject.toml"  # Explicit glob – adjust if uv.lock is not at root

      - name: Set up Python (optional but recommended – auto picks from pyproject.toml or .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      # Add your lint/test steps here, e.g.:
      - name: Lint with ruff (if you have it)
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest  # Replace with your actual test command