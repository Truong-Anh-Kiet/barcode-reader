name: Basic Python CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Nâng cấp lên v4 cho tốt hơn

    - name: Install uv (official action)
      uses: astral-sh/setup-uv@v3  # Hoặc v3/v2 nếu v3 chưa ổn định, nhưng v3 mới nhất
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"  # Cache dựa trên uv.lock để reuse

    - name: Set up Python (tự động dùng version từ pyproject.toml hoặc .python-version nếu có)
      run: uv python install

    - name: Install dependencies (sync với --frozen an toàn hơn)
      run: uv sync --frozen --no-dev --no-install-project

    - name: Run lint (ví dụ eslint hoặc ruff nếu có)
      run: uv run ruff check .  # Thay bằng lệnh lint của bạn, hoặc bỏ nếu chưa có

    - name: Run tests (ví dụ pytest)
      run: uv run pytest  # Thay bằng lệnh test thực tế