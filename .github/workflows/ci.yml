name: Basic Python CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pipx install uv==0.4.13

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: uv sync --frozen --no-dev --no-install-project

    - name: Lint with flake8
      run: |
        uv run flake8 src || true

    - name: Run tests
      run: |
        uv run pytest || true
