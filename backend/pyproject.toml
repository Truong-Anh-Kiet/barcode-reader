[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode"
version = "0.1.0"
description = "Barcode project using Python"
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "click>=8.3.1",
    "cloudinary>=1.44.1",
    "fastapi[standard]>=0.128.0",
    "fastapi-mail>=1.6.1",
    "fastapi-users[sqlalchemy]>=15.0.3",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.11.0.86",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.45",
    "ultralytics>=8.4.7",
    "uvicorn[standard]>=0.40.0",
    "zxing-cpp>=2.3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[dependency-groups]
dev = [
    "flake8>=7.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "isort>=7.0.0",
]
